<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutMoney - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 70px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121722;
            border-bottom: 2px solid #1f2638;
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 51, 153, 0.8), 0 0 25px rgba(255, 51, 153, 0.4);
        }

        .brand-title span {
            color: #ff3399;
        }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e5e7eb;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        /* Card dello stile esatto della foto mandata */
        .game-card {
            background: #121722;
            border: 2px solid #1f2638;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            position: relative;
        }

        .game-card:hover {
            border-color: #ff3399;
            box-shadow: 0 0 20px rgba(255, 51, 153, 0.5);
            transform: translateY(-2px);
        }

        /* Immagine di sfondo esatta della card */
        .game-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            display: block;
        }

        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #121722;
            border-top: 2px solid #1f2638;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: #9ca3af;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            color: #ff3399;
            text-shadow: 0 0 8px rgba(255, 51, 153, 0.6);
        }

        .nav-icon {
            font-size: 1.3rem;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">Donut<span>Money</span></div>
        <div></div>
    </header>

    <main>
        <div class="section-title">🔥 Giochi in Evidenza</div>
        
        <div class="games-grid">
            <!-- Card con l'immagine esatta della bomba, diamante, scritta Mines e 3% edge -->
            <div class="game-card" onclick="alert('Apriamo Mines!')">
                <img src="http://googleusercontent.com/image_collection/image_retrieval/12028689510405187760_0" alt="Mines Game Card">
            </div>
        </div>

        <footer>
            &copy; 2026 DonutMoney. Tutti i diritti riservati.
        </footer>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="alert('Sezione Giochi')">
            <span class="nav-icon">🎮</span>
            <span>Giochi</span>
        </button>
        <button class="nav-item" onclick="alert('Profilo')">
            <span class="nav-icon">👤</span>
            <span>Profilo</span>
        </button>
    </nav>

</body>
</html>
