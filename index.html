<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutFlip Deluxe - Casino Experience</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.75);
            --accent-pink: #ff2a85;
            --accent-cyan: #00f0ff;
            --gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 42, 133, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .casino-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 16px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .balance-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .balance-amount {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* Arena di Gioco / Coin 3D */
        .arena {
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            margin-bottom: 24px;
            position: relative;
        }

        .coin {
            width: 130px;
            height: 130px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 10px 20px rgba(0,0,0,0.4);
            border: 4px solid var(--gold);
            font-weight: bold;
            text-transform: uppercase;
        }

        .coin-front {
            background: radial-gradient(circle, #ff2a85 0%, #b8004c 100%);
            color: white;
        }

        .coin-back {
            background: radial-gradient(circle, #00f0ff 0%, #0077b6 100%);
            color: white;
            transform: rotateY(180deg);
        }

        /* Controlli di Puntata */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bet-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .bet-input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .bet-controls-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"] {
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: bold;
            width: 90px;
            text-align: right;
            outline: none;
        }

        .quick-btns {
            display: flex;
            gap: 4px;
        }

        .btn-quick {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-quick:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .choice-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .choice-btn.selected[data-choice="pink"] {
            border-color: var(--accent-pink);
            background: rgba(255, 42, 133, 0.2);
            box-shadow: 0 0 15px rgba(255, 42, 133, 0.4);
        }

        .choice-btn.selected[data-choice="cyan"] {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .btn-spin {
            background: linear-gradient(135deg, var(--accent-pink), #8a2be2);
            border: none;
            padding: 16px;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(255, 42, 133, 0.4);
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .btn-spin:hover:not(:disabled) {
            filter: brightness(1.1);
        }

        .btn-spin:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-spin:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 16px;
            text-align: center;
            font-size: 0.9rem;
            min-height: 24px;
            color: var(--text-muted);
        }

        /* Animazione di rotazione 3D dinamica via JS */
        @keyframes flipAnimation {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(1440deg) rotateY(var(--final-rotation)); }
        }
    </style>
</head>
<body>

    <div class="casino-container">
        <header>
            <div class="logo">DonutFlip</div>
            <div class="balance-box">
                <span class="balance-label">Saldo Virtuale</span>
                <span class="balance-amount" id="balanceDisplay">$1,000.00</span>
            </div>
        </header>

        <div class="arena">
            <div class="coin" id="coin">
                <div class="coin-face coin-front">
                    <span style="font-size: 2rem;">🍩</span>
                    <span style="font-size: 0.7rem; margin-top: 4px;">Pink</span>
                </div>
                <div class="coin-face coin-back">
                    <span style="font-size: 2rem;">💎</span>
                    <span style="font-size: 0.7rem; margin-top: 4px;">Cyan</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="bet-input-group">
                <label for="betAmount">Puntata</label>
                <div class="bet-controls-right">
                    <input type="number" id="betAmount" value="50" min="1" max="1000">
                    <div class="quick-btns">
                        <button class="btn-quick" onclick="setMultiplier(0.5)">1/2</button>
                        <button class="btn-quick" onclick="setMultiplier(2)">2x</button>
                        <button class="btn-quick" onclick="setMax()">MAX</button>
                    </div>
                </div>
            </div>

            <div class="choice-selection">
                <button class="choice-btn selected" data-choice="pink" onclick="selectChoice('pink')">Scegli Pink (🍩)</button>
                <button class="choice-btn" data-choice="cyan" onclick="selectChoice('cyan')">Scegli Cyan (💎)</button>
            </div>

            <button class="btn-spin" id="spinBtn" onclick="playGame()">Lancia Moneta</button>
        </div>

        <div class="status-message" id="statusMsg">Seleziona la tua fazione e lancia!</div>
    </div>

    <script>
        let balance = 1000.00;
        let selectedChoice = 'pink';
        let isPlaying = false;

        const balanceDisplay = document.getElementById('balanceDisplay');
        const betInput = document.getElementById('betAmount');
        const coin = document.getElementById('coin');
        const spinBtn = document.getElementById('spinBtn');
        const statusMsg = document.getElementById('statusMsg');
        const choiceBtns = document.querySelectorAll('.choice-btn');

        function updateBalance() {
            balanceDisplay.textContent = `$${balance.toFixed(2)}`;
        }

        function selectChoice(choice) {
            if (isPlaying) return;
            selectedChoice = choice;
            choiceBtns.forEach(btn => {
                if (btn.dataset.choice === choice) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        function setMultiplier(mult) {
            if (isPlaying) return;
            let currentBet = parseFloat(betInput.value) || 0;
            let newBet = Math.max(1, Math.floor(currentBet * mult));
            if (newBet > balance) newBet = balance;
            betInput.value = newBet;
        }

        function setMax() {
            if (isPlaying) return;
            betInput.value = balance;
        }

        function playGame() {
            if (isPlaying) return;
            
            let bet = parseFloat(betInput.value);
            if (isNaN(bet) || bet <= 0) {
                statusMsg.textContent = "Inserisci una puntata valida!";
                return;
            }
            if (bet > balance) {
                statusMsg.textContent = "Saldo insufficiente!";
                return;
            }

            isPlaying = true;
            spinBtn.disabled = true;
            balance -= bet;
            updateBalance();
            statusMsg.textContent = "La moneta sta girando...";

            // Determina il risultato casuale (0 = Pink, 1 = Cyan)
            const outcome = Math.random() < 0.5 ? 'pink' : 'cyan';
            
            // Calcola la rotazione finale in gradi per l'asse Y
            // Pink = 0deg (faccia front), Cyan = 180deg (faccia back) più giri completi
            const baseRotations = 5 * 360; 
            const finalYRotation = outcome === 'pink' ? baseRotations : baseRotations + 180;

            coin.style.transition = 'transform 2s cubic-bezier(0.15, 0.85, 0.35, 1)';
            coin.style.transform = `rotateX(720deg) rotateY(${finalYRotation}deg)`;

            setTimeout(() => {
                isPlaying = false;
                spinBtn.disabled = false;

                if (selectedChoice === outcome) {
                    const winAmount = bet * 2;
                    balance += winAmount;
                    statusMsg.innerHTML = `<span style="color: var(--gold); font-weight: bold;">Hai vinto $${winAmount.toFixed(2)}!</span>`;
                } else {
                    statusMsg.innerHTML = `<span style="color: var(--accent-pink);">Hai perso la puntata. Riprova!</span>`;
                }
                updateBalance();
            }, 2000);
        }
    </script>
</body>
</html>
