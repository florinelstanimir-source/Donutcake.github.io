<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Donut Flip</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome per icone di servizio -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #121826;
            padding: 10px 14px;
            border-bottom: 1px solid #1e2638;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-dice {
            background: #1e2638;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 14px;
            color: #a0aec0;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .logo-text span {
            display: block;
            font-size: 11px;
            color: #4ade80;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-box {
            display: flex;
            align-items: center;
            background: #182030;
            border: 1px solid #25304a;
            border-radius: 8px;
            padding: 4px 8px;
            gap: 6px;
        }

        .coin-icon {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #facc15 0%, #ca8a04 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            color: #422006;
            box-shadow: 0 0 6px rgba(250, 204, 21, 0.4);
        }

        .balance-amount {
            font-size: 12px;
            font-weight: 700;
            color: #f3f4f6;
        }

        .btn-plus {
            background: #16a34a;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(22, 163, 74,.3);
        }

        .btn-signin {
            background: #16a34a;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(22, 163, 74, 0.4);
        }

        /* Main Container */
        .main-container {
            padding: 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Section Header */
        .section-header h2 {
            font-size: 15px;
            font-weight: 800;
            color: #f9fafb;
            margin-bottom: 2px;
        }

        .section-header p {
            font-size: 11px;
            color: #9ca3af;
        }

        /* Top Promos */
        .top-cards-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .top-cards-scroll::-webkit-scrollbar {
            display: none;
        }

        .promo-card {
            min-width: 180px;
            height: 95px;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .card-race {
            background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%);
        }

        .card-referrals {
            background: linear-gradient(135deg, #0f766e 0%, #042f2e 100%);
        }

        .promo-card h3 {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .promo-card p {
            font-size: 9px;
            color: #d1d5db;
            z-index: 2;
            margin-top: 2px;
            line-height: 1.2;
        }

        .promo-card .card-icon-bg {
            position: absolute;
            right: 8px;
            top: 8px;
            font-size: 32px;
            opacity: 0.25;
            z-index: 1;
        }

        /* Games Grid Section */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .game-card {
            background-size: cover;
            background-position: center;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            overflow: hidden;
            height: 125px;
        }

        .game-card:active {
            transform: scale(0.96);
            border-color: #16a34a;
        }

        .game-info {
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .game-card span.game-title {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        .game-card .edge-text {
            font-size: 9px;
            color: #fca5a5;
            font-weight: 600;
            margin-top: 1px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .badge-hot {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ef4444;
            color: white;
            font-size: 7px;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 4px;
            text-transform: uppercase;
            z-index: 3;
        }

        /* STILI SPECIFICI COINFLIP (Sfondo scuro caverna + moneta 3D) */
        .card-coinflip-custom {
            background: radial-gradient(circle at 50% 30%, #3d2c1d 0%, #120d08 70%, #080503 100%);
            border-color: #382717;
        }

        .coin-graphic-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            margin-top: 6px;
        }

        .coin-3d {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #854d0e 100%);
            border-radius: 50%;
            border: 3px solid #fef9c3;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.4), inset 0 0 8px rgba(0,0,0,0.5);
            transform: rotateX(55deg) rotateY(-15deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .coin-3d::after {
            content: '';
            width: 30px;
            height: 30px;
            border: 2px dashed #a16207;
            border-radius: 50%;
        }

        /* STILI SPECIFICI BLACKJACK (Sfondo verde scuro + Carte) */
        .card-blackjack-custom {
            background: radial-gradient(circle at 50% 30%, #064e3b 0%, #022c22 60%, #011711 100%);
            border-color: #065f46;
        }

        .blackjack-graphic-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            width: 100%;
            margin-top: 6px;
        }

        .mini-card {
            width: 26px;
            height: 36px;
            background: #f8fafc;
            border-radius: 4px;
            position: absolute;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2px 3px;
            font-size: 8px;
            font-weight: 900;
        }

        .card-1 {
            transform: translateX(-10px) rotate(-12deg);
            color: #1e293b;
        }

        .card-2 {
            transform: translateX(6px) rotate(8deg);
            color: #059669;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo-dice"><i class="fa-solid fa-dice"></i></div>
            <div class="logo-text">
                DONUT
                <span>FLIP</span>
            </div>
        </div>
        <div class="nav-right">
            <div class="balance-box">
                <div class="coin-icon">DF</div>
                <span class="balance-amount">0.00</span>
                <button class="btn-plus">+</button>
            </div>
            <button class="btn-signin">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-container">
        
        <!-- Top Promos -->
        <div class="top-cards-scroll">
            <div class="promo-card card-race">
                <i class="fa-solid fa-trophy card-icon-bg"></i>
                <h3>RACE</h3>
                <p>Climb the board, win the pot</p>
            </div>
            <div class="promo-card card-referrals">
                <i class="fa-solid fa-users card-icon-bg"></i>
                <h3>REFERRALS</h3>
                <p>Invite friends, earn commission</p>
            </div>
        </div>

        <!-- Games Section Header -->
        <div class="section-header" style="margin-top: 4px;">
            <h2>Games</h2>
            <p>Play using site balance</p>
        </div>

        <!-- Games Grid -->
        <div class="games-grid">
            <!-- Cases -->
            <div class="game-card" style="background-image: linear-gradient(rgba(10, 15, 25, 0.4), rgba(10, 15, 25, 0.85)), url('URL_IMMAGINE_CASES');">
                <div class="game-info">
                    <span class="game-title">Cases</span>
                </div>
            </div>

            <!-- Case Battles -->
            <div class="game-card" style="background-image: linear-gradient(rgba(10, 15, 25, 0.4), rgba(10, 15, 25, 0.85)), url('URL_IMMAGINE_CASE_BATTLES');">
                <span class="badge-hot">Hot</span>
                <div class="game-info">
                    <span class="game-title">Case Battles</span>
                </div>
            </div>

            <!-- Mines (Con l'immagine personalizzata stile castello) -->
            <div class="game-card" style="background-image: linear-gradient(rgba(10, 15, 25, 0.2), rgba(10, 15, 25, 0.85)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=300&auto=format&fit=crop');">
                <div class="game-info">
                    <span class="game-title">Mines</span>
                    <div class="edge-text">3% edge</div>
                </div>
            </div>

            <!-- Towers -->
            <div class="game-card" style="background-image: linear-gradient(rgba(10, 15, 25, 0.4), rgba(10, 15, 25, 0.85)), url('URL_IMMAGINE_TOWERS');">
                <div class="game-info">
                    <span class="game-title">Towers</span>
                </div>
            </div>

            <!-- Coinflip (Stile screenshot donutbunny) -->
            <div class="game-card card-coinflip-custom">
                <div class="coin-graphic-wrap">
                    <div class="coin-3d"></div>
                </div>
                <div class="game-info">
                    <span class="game-title">Coinflip</span>
                    <div class="edge-text">2.5% edge</div>
                </div>
            </div>

            <!-- Blackjack (Stile screenshot donutbunny) -->
            <div class="game-card card-blackjack-custom">
                <div class="blackjack-graphic-wrap">
                    <div class="mini-card card-1">
                        <span>A</span>
                        <span style="text-align: right;">♠</span>
                    </div>
                    <div class="mini-card card-2">
                        <span>10</span>
                        <span style="text-align: right;">♠</span>
                    </div>
                </div>
                <div class="game-info">
                    <span class="game-title">Blackjack</span>
                    <div class="edge-text">0.5% edge</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
