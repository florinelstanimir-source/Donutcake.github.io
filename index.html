<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutMoney - Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121722;
            border-bottom: 2px solid #1f2638;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-badge {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #ff3399;
            box-shadow: 0 0 12px rgba(255, 51, 153, 0.6);
            /* Immagine al neon impostata come miniatura circolare */
            background-image: url('http://googleusercontent.com/image_collection/image_retrieval/10782868531433145201_0');
            background-size: cover;
            background-position: center;
        }

        .balance-container {
            display: flex;
            align-items: center;
            background: #1a2233;
            border: 1px solid #ff3399;
            padding: 6px 14px;
            border-radius: 20px;
            box-shadow: 0 0 8px rgba(255, 51, 153, 0.3);
        }

        .balance-container span {
            font-weight: bold;
            color: #ffd700;
            margin-left: 8px;
            font-size: 1.05rem;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #6b7280;
            background-color: #121722;
            border-top: 1px solid #1f2638;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-badge" title="DonutMoney Logo"></div>
        </div>
        <div class="balance-container">
            🍩 <span>1,000.00</span>
        </div>
    </header>

    <main>
        <!-- Area centrale pulita e vuota come richiesto -->
    </main>

    <footer>
        &copy; 2026 DonutMoney. Tutti i diritti riservati.
    </footer>

</body>
</html>
