<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutSMP Casino - VIP Suite</title>
    <style>
        :root {
            --bg-color: #05070c;
            --panel-bg: rgba(13, 17, 28, 0.85);
            --panel-border: rgba(255, 255, 255, 0.1);
            --accent-pink: #ff2a85;
            --accent-cyan: #00f0ff;
            --gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 42, 133, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.08) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .casino-wrapper {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 16px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-pink), var(--accent-cyan), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
            filter: drop-shadow(0 2px 10px rgba(255,42,133,0.4));
        }

        .balance-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 8px 16px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.1);
        }

        .balance-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-amount {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--gold);
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Tabs di navigazione giochi */
        .game-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--panel-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 4px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(255, 42, 133, 0.3), rgba(0, 240, 255, 0.3));
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .game-view {
            display: none;
        }

        .game-view.active {
            display: block;
        }

        /* Controlli Puntata */
        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 16px;
        }

        .bet-input-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid var(--panel-border);
        }

        .bet-input-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .bet-controls-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        input[type="number"] {
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: 800;
            width: 85px;
            text-align: right;
            outline: none;
        }

        .quick-btns {
            display: flex;
            gap: 3px;
        }

        .btn-quick {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-quick:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- GIOCO 1: DONUT FLIP --- */
        .arena-flip {
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .coin {
            width: 120px;
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.7), 0 10px 20px rgba(0,0,0,0.5);
            border: 4px solid var(--gold);
            font-weight: bold;
            text-transform: uppercase;
        }

        .coin-front { background: radial-gradient(circle, #ff2a85 0%, #7b0026 100%); color: white; }
        .coin-back { background: radial-gradient(circle, #00f0ff 0%, #005666 100%); color: white; transform: rotateY(180deg); }

        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-size: 0.85rem;
        }

        .choice-btn.selected[data-choice="pink"] { border-color: var(--accent-pink); background: rgba(255, 42, 133, 0.25); box-shadow: 0 0 15px rgba(255, 42, 133, 0.4); }
        .choice-btn.selected[data-choice="cyan"] { border-color: var(--accent-cyan); background: rgba(0, 240, 255, 0.25); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }

        /* --- GIOCO 2: ROULETTE --- */
        .arena-roulette {
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .roulette-pointer {
            position: absolute;
            top: 2px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 14px solid var(--gold);
            z-index: 20;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .roulette-container {
            width: 170px;
            height: 170px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--gold);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            background: conic-gradient(
                #ff2a85 0deg 60deg,
                #1f2937 60deg 120deg,
                #00f0ff 120deg 180deg,
                #ff2a85 180deg 240deg,
                #1f2937 240deg 300deg,
                #00f0ff 300deg 360deg
            );
            transition: transform 3.5s cubic-bezier(0.15, 0.85, 0.15, 1);
        }

        .roulette-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .roulette-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.1);
            padding: 10px 4px;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .roulette-btn.selected[data-rchoice="red"] { border-color: var(--accent-pink); background: rgba(255,42,133,0.3); }
        .roulette-btn.selected[data-rchoice="black"] { border-color: #6b7280; background: rgba(107,114,128,0.3); }
        .roulette-btn.selected[data-rchoice="cyan"] { border-color: var(--accent-cyan); background: rgba(0,240,255,0.3); }

        /* --- GIOCO 3: CRASH --- */
        .arena-crash {
            height: 180px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .crash-multiplier {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        .crash-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Pulsante Azione Principale */
        .btn-action {
            background: linear-gradient(135deg, var(--accent-pink), #7928ca);
            border: none;
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(255, 42, 133, 0.4);
            transition: transform 0.1s ease, filter 0.2s ease;
            width: 100%;
            margin-top: 6px;
        }

        .btn-action:hover:not(:disabled) { filter: brightness(1.15); }
        .btn-action:active:not(:disabled) { transform: scale(0.98); }
        .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }

        .status-message {
            margin-top: 12px;
            text-align: center;
            font-size: 0.85rem;
            min-height: 22px;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="casino-wrapper">
        <header>
            <div class="logo">DonutSMP</div>
            <div class="balance-box">
                <span class="balance-label">Saldo VIP</span>
                <span class="balance-amount" id="balanceDisplay">$1,000.00</span>
            </div>
        </header>

        <div class="game-tabs">
            <button class="tab-btn active" onclick="switchGame('flip')">DonutFlip</button>
            <button class="tab-btn" onclick="switchGame('roulette')">Roulette</button>
            <button class="tab-btn" onclick="switchGame('crash')">Crash Game</button>
        </div>

        <!-- DONUT FLIP -->
        <div id="view-flip" class="game-view active">
            <div class="arena-flip">
                <div class="coin" id="coin">
                    <div class="coin-face coin-front"><span style="font-size: 2rem;">🍩</span><span style="font-size: 0.6rem;">Pink</span></div>
                    <div class="coin-face coin-back"><span style="font-size: 2rem;">💎</span><span style="font-size: 0.6rem;">Cyan</span></div>
                </div>
            </div>
            <div class="controls-section">
                <div class="bet-input-group">
                    <label>Puntata</label>
                    <div class="bet-controls-right">
                        <input type="number" id="betFlip" value="50" min="1">
                        <div class="quick-btns">
                            <button class="btn-quick" onclick="adjustBet('flip', 0.5)">½</button>
                            <button class="btn-quick" onclick="adjustBet('flip', 2)">2×</button>
                            <button class="btn-quick" onclick="maxBet('flip')">MAX</button>
                        </div>
                    </div>
                </div>
                <div class="choice-grid">
                    <button class="choice-btn selected" data-choice="pink" onclick="selectFlipChoice('pink')">Pink (🍩)</button>
                    <button class="choice-btn" data-choice="cyan" onclick="selectFlipChoice('cyan')">Cyan (💎)</button>
                </div>
                <button class="btn-action" id="spinFlipBtn" onclick="playFlip()">Lancia Moneta</button>
            </div>
        </div>

        <!-- ROULETTE -->
        <div id="view-roulette" class="game-view">
            <div class="arena-roulette">
                <div class="roulette-pointer"></div>
                <div class="roulette-container">
                    <div class="roulette-wheel" id="rouletteWheel"></div>
                </div>
            </div>
            <div class="controls-section">
                <div class="bet-input-group">
                    <label>Puntata</label>
                    <div class="bet-controls-right">
                        <input type="number" id="betRoulette" value="50" min="1">
                        <div class="quick-btns">
                            <button class="btn-quick" onclick="adjustBet('roulette', 0.5)">½</button>
                            <button class="btn-quick" onclick="adjustBet('roulette', 2)">2×</button>
                            <button class="btn-quick" onclick="maxBet('roulette')">MAX</button>
                        </div>
                    </div>
                </div>
                <div class="roulette-options">
                    <button class="roulette-btn selected" data-rchoice="red" onclick="selectRouletteChoice('red')">Rosso (2x)</button>
                    <button class="roulette-btn" data-rchoice="black" onclick="selectRouletteChoice('black')">Nero (2x)</button>
                    <button class="roulette-btn" data-rchoice="cyan" onclick="selectRouletteChoice('cyan')">Cyan (3x)</button>
                </div>
                <button class="btn-action" id="spinRouletteBtn" onclick="playRoulette()">Gira Roulette</button>
            </div>
        </div>

        <!-- CRASH -->
        <div id="view-crash" class="game-view">
            <div class="arena-crash">
                <div class="crash-multiplier" id="crashMultiplier">1.00x</div>
                <div class="crash-status" id="crashStatus">Pronto al decollo</div>
            </div>
            <div class="controls-section">
                <div class="bet-input-group">
                    <label>Puntata</label>
                    <div class="bet-controls-right">
                        <input type="number" id="betCrash" value="50" min="1">
                        <div class="quick-btns">
                            <button class="btn-quick" onclick="adjustBet('crash', 0.5)">½</button>
                            <button class="btn-quick" onclick="adjustBet('crash', 2)">2×</button>
                            <button class="btn-quick" onclick="maxBet('crash')">MAX</button>
                        </div>
                    </div>
                </div>
                <button class="btn-action" id="crashActionBtn" onclick="handleCrashAction()">Avvia Crash</button>
            </div>
        </div>

        <div class="status-message" id="statusMsg">Piazza la tua puntata e gioca!</div>
    </div>

    <script>
        let balance = 1000.00;
        const balanceDisplay = document.getElementById('balanceDisplay');
        const statusMsg = document.getElementById('statusMsg');

        function updateBalance() { balanceDisplay.textContent = `$${balance.toFixed(2)}`; }

        function switchGame(key) {
            document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
            document.getElementById(`view-${key}`).classList.add('active');
            event.currentTarget.classList.add('active');
            statusMsg.textContent = "Fai la tua puntata!";
        }

        function adjustBet(game, mult) {
            const input = document.getElementById(`bet${game.charAt(0).toUpperCase() + game.slice(1)}`);
            let val = parseFloat(input.value) || 0;
            let res = Math.max(1, Math.floor(val * mult));
            if (res > balance) res = balance;
            input.value = res;
        }

        function maxBet(game) {
            document.getElementById(`bet${game.charAt(0).toUpperCase() + game.slice(1)}`).value = balance;
        }

        // FLIP LOGIC
        let flipChoice = 'pink';
        let isFlipPlaying = false;
        function selectFlipChoice(c) {
            if (isFlipPlaying) return;
            flipChoice = c;
            document.querySelectorAll('.choice-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.choice === c);
            });
        }
        function playFlip() {
            if (isFlipPlaying) return;
            let bet = parseFloat(document.getElementById('betFlip').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { statusMsg.textContent = "Puntata non valida!"; return; }
            
            isFlipPlaying = true;
            document.getElementById('spinFlipBtn').disabled = true;
            balance -= bet; updateBalance();
            statusMsg.textContent = "Moneta in volo...";

            const outcome = Math.random() < 0.5 ? 'pink' : 'cyan';
            const coin = document.getElementById('coin');
            const targetRot = 1800 + (outcome === 'pink' ? 0 : 180);
            coin.style.transition = 'transform 2s cubic-bezier(0.15, 0.85, 0.35, 1)';
            coin.style.transform = `rotateX(720deg) rotateY(${targetRot}deg)`;

            setTimeout(() => {
                isFlipPlaying = false;
                document.getElementById('spinFlipBtn').disabled = false;
                if (flipChoice === outcome) {
                    let win = bet * 2; balance += win;
                    statusMsg.innerHTML = `<span style="color: var(--gold);">Hai vinto $${win.toFixed(2)}!</span>`;
                } else {
                    statusMsg.innerHTML = `<span style="color: var(--accent-pink);">Hai perso! Riprova.</span>`;
                }
                updateBalance();
            }, 2000);
        }

        // ROULETTE LOGIC
        const sectors = [
            { name: 'red', mult: 2, angle: 30 },
            { name: 'black', mult: 2, angle: 90 },
            { name: 'cyan', mult: 3, angle: 150 },
            { name: 'red', mult: 2, angle: 210 },
            { name: 'black', mult: 2, angle: 270 },
            { name: 'cyan', mult: 3, angle: 330 }
        ];
        let rouletteChoice = 'red';
        let isRoulettePlaying = false;
        let wheelRotation = 0;

        function selectRouletteChoice(c) {
            if (isRoulettePlaying) return;
            rouletteChoice = c;
            document.querySelectorAll('.roulette-btn').forEach(b => {
                b.classList.toggle('selected', b.dataset.rchoice === c);
            });
        }
        function playRoulette() {
            if (isRoulettePlaying) return;
            let bet = parseFloat(document.getElementById('betRoulette').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) { statusMsg.textContent = "Puntata non valida!"; return; }

            isRoulettePlaying = true;
            document.getElementById('spinRouletteBtn').disabled = true;
            balance -= bet; updateBalance();
            statusMsg.textContent = "La roulette gira...";

            const index = Math.floor(Math.random() * sectors.length);
            const target = sectors[index];
            wheelRotation = wheelRotation + 2160 + (360 - target.angle - (wheelRotation % 360));

            const wheel = document.getElementById('rouletteWheel');
            wheel.style.transition = 'transform 3.5s cubic-bezier(0.15, 0.85, 0.15, 1)';
            wheel.style.transform = `rotate(${wheelRotation}deg)`;

            setTimeout(() => {
                isRoulettePlaying = false;
                document.getElementById('spinRouletteBtn').disabled = false;
                if (rouletteChoice === target.name) {
                    let win = bet * target.mult; balance += win;
                    statusMsg.innerHTML = `<span style="color: var(--gold);">Uscito ${target.name.toUpperCase()}! Vinto $${win.toFixed(2)}!</span>`;
                } else {
                    statusMsg.innerHTML = `<span style="color: var(--accent-pink);">Uscito ${target.name.toUpperCase()}. Perso!</span>`;
                }
                updateBalance();
            }, 3500);
        }

        // CRASH LOGIC
        let isCrashRunning = false, crashInterval = null, currentMult = 1.00, crashPoint = 1.00, crashBet = 0;
        function handleCrashAction() {
            const btn = document.getElementById('crashActionBtn');
            if (!isCrashRunning) {
                crashBet = parseFloat(document.getElementById('betCrash').value);
                if (isNaN(crashBet) || crashBet <= 0 || crashBet > balance) { statusMsg.textContent = "Fondi insufficienti!"; return; }
                balance -= crashBet; updateBalance();

                isCrashRunning = true; currentMult = 1.00;
                crashPoint = parseFloat((1.01 + Math.random() * 3).toFixed(2));
                btn.textContent = "Incassa";
                statusMsg.textContent = "In volo...";

                crashInterval = setInterval(() => {
                    currentMult += 0.02;
                    document.getElementById('crashMultiplier').textContent = currentMult.toFixed(2) + 'x';
                    if (currentMult >= crashPoint) endCrash(false);
                }, 80);
            } else {
                endCrash(true);
            }
        }
        function endCrash(cashedOut) {
            clearInterval(crashInterval);
            isCrashRunning = false;
            document.getElementById('crashActionBtn').textContent = "Avvia Crash";
            if (cashedOut) {
                let win = crashBet * currentMult; balance += win;
                statusMsg.innerHTML = `<span style="color: var(--gold);">Incassato a ${currentMult.toFixed(2)}x! Vinto $${win.toFixed(2)}!</span>`;
            } else {
                statusMsg.innerHTML = `<span style="color: var(--accent-pink);">CRASHED a ${crashPoint.toFixed(2)}x!</span>`;
            }
            updateBalance();
        }
    </script>
</body>
</html>
