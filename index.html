<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Donut Flip</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #080c14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0f172a;
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-dice {
            background: #1e293b;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .logo-text span {
            display: block;
            font-size: 11px;
            color: #4ade80;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-box {
            display: flex;
            align-items: center;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 4px 8px;
            gap: 6px;
        }

        .coin-icon {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #facc15 0%, #ca8a04 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: 900;
            color: #422006;
        }

        .balance-amount {
            font-size: 12px;
            font-weight: 700;
            color: #f8fafc;
        }

        .btn-plus {
            background: #22c55e;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .btn-signin {
            background: #22c55e;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        /* Main Container */
        .main-container {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        /* Promos Horizontal Scroll */
        .top-cards-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .top-cards-scroll::-webkit-scrollbar {
            display: none;
        }

        .promo-card {
            min-width: 200px;
            height: 100px;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card-race {
            background: linear-gradient(135deg, #241242 0%, #120824 100%);
        }

        .card-referrals {
            background: linear-gradient(135deg, #093b32 0%, #031a16 100%);
        }

        .promo-card h3 {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        .promo-card p {
            font-size: 10px;
            color: #94a3b8;
            z-index: 2;
            margin-top: 2px;
        }

        .promo-card .card-icon-bg {
            position: absolute;
            right: 12px;
            top: 12px;
            font-size: 36px;
            opacity: 0.2;
            z-index: 1;
        }

        /* Section Header */
        .section-header h2 {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }

        .section-header p {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .game-card {
            border-radius: 16px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            cursor: pointer;
            height: 135px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.1s ease;
        }

        .game-card:active {
            transform: scale(0.96);
        }

        .graphic-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .game-info {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-title {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
        }

        .edge-text {
            font-size: 10px;
            color: #94a3b8;
            font-weight: 600;
            margin-top: 1px;
        }

        .badge-hot {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ef4444;
            color: white;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* --- STILI SPECIFICI SCHEDE (ORIGINALI) --- */

        /* 1. Cases */
        .card-cases {
            background: radial-gradient(circle at 50% 35%, #2a1040 0%, #12071c 70%, #09030e 100%);
            border-color: #3a1859;
        }

        .case-box {
            width: 44px;
            height: 34px;
            background: #1e0b30;
            border: 2px solid #eab308;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .case-box::before {
            content: '';
            position: absolute;
            top: 10px;
            width: 100%;
            height: 2px;
            background: #eab308;
        }

        .case-lock-dot {
            width: 8px;
            height: 6px;
            background: #fef08a;
            border-radius: 2px;
            z-index: 2;
        }

        /* 2. Case Battles */
        .card-case-battles {
            background: radial-gradient(circle at 50% 35%, #2a1040 0%, #12071c 70%, #09030e 100%);
            border-color: #3a1859;
        }

        .battle-box-mini {
            width: 28px;
            height: 22px;
            background: #1e0b30;
            border: 1.5px solid #a855f7;
            border-radius: 5px;
            position: absolute;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
        }

        .battle-left {
            transform: translateX(-12px) rotate(-12deg);
        }

        .battle-right {
            transform: translateX(12px) rotate(12deg);
        }

        .battle-glow {
            width: 14px;
            height: 14px;
            background: #eab308;
            border-radius: 50%;
            box-shadow: 0 0 12px #eab308;
            z-index: 3;
        }

        /* 3. Mines */
        .card-mines {
            background: radial-gradient(circle at 50% 35%, #380a0a 0%, #170404 70%, #0a0202 100%);
            border-color: #521111;
        }

        .mine-ball {
            width: 26px;
            height: 26px;
            background: #1f1f22;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.8);
        }

        .mine-ball::after {
            content: '';
            position: absolute;
            top: -3px;
            right: -2px;
            width: 6px;
            height: 6px;
            border-top: 2px solid #ef4444;
            border-right: 2px solid #ef4444;
            border-radius: 0 3px 0 0;
        }

        .red-gem {
            width: 18px;
            height: 18px;
            background: #ef4444;
            transform: rotate(45deg);
            border-radius: 2px;
            box-shadow: 0 0 12px #ef4444;
            margin-left: 6px;
        }

        /* 4. Towers */
        .card-towers {
            background: radial-gradient(circle at 50% 35%, #082d47 0%, #041421 70%, #020a10 100%);
            border-color: #0e4369;
        }

        .tower-icon {
            width: 32px;
            height: 40px;
            background: #38bdf8;
            clip-path: polygon(0% 0%, 25% 0%, 25% 15%, 50% 15%, 50% 0%, 75% 0%, 75% 15%, 100% 15%, 100% 0%, 85% 100%, 15% 100%);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        /* 5. Coinflip */
        .card-coinflip {
            background: radial-gradient(circle at 50% 35%, #3d290c 0%, #1a1004 70%, #0a0601 100%);
            border-color: #543810;
        }

        .coin-3d-glow {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #854d0e 100%);
            border-radius: 50%;
            border: 2px solid #fef9c3;
            box-shadow: 0 0 14px rgba(234, 179, 8, 0.6);
            transform: rotateX(55deg);
        }

        /* 6. Blackjack */
        .card-blackjack {
            background: radial-gradient(circle at 50% 35%, #0a3323 0%, #031710 70%, #010a07 100%);
            border-color: #104732;
        }

        .card-shape {
            width: 24px;
            height: 34px;
            background: #ffffff;
            border-radius: 4px;
            position: absolute;
            padding: 2px;
            font-weight: 900;
            font-size: 8px;
            color: #0f172a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .card-left {
            transform: translateX(-8px) rotate(-10deg);
        }

        .card-right {
            transform: translateX(8px) rotate(10deg);
            color: #059669;
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo-dice"><i class="fa-solid fa-dice"></i></div>
            <div class="logo-text">
                DONUT
                <span>FLIP</span>
            </div>
        </div>
        <div class="nav-right">
            <div class="balance-box">
                <div class="coin-icon">DF</div>
                <span class="balance-amount">0.00</span>
                <button class="btn-plus">+</button>
            </div>
            <button class="btn-signin">Sign In</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        
        <!-- Top Promos -->
        <div class="top-cards-scroll">
            <div class="promo-card card-race">
                <i class="fa-solid fa-trophy card-icon-bg"></i>
                <h3>RACE</h3>
                <p>Climb the board, win the pot</p>
            </div>
            <div class="promo-card card-referrals">
                <i class="fa-solid fa-users card-icon-bg"></i>
                <h3>REFERRALS</h3>
                <p>Invite friends, earn commission</p>
            </div>
        </div>

        <!-- Section Header -->
        <div class="section-header">
            <h2>Games</h2>
            <p>Play using site balance</p>
        </div>

        <!-- Games Grid -->
        <div class="games-grid">
            
            <!-- Cases -->
            <div class="game-card card-cases">
                <div class="graphic-wrap">
                    <div class="case-box">
                        <div class="case-lock-dot"></div>
                    </div>
                </div>
                <div class="game-info">
                    <span class="game-title">Cases</span>
                    <span class="edge-text">3% edge</span>
                </div>
            </div>

            <!-- Case Battles -->
            <div class="game-card card-case-battles">
                <span class="badge-hot">Hot</span>
                <div class="graphic-wrap">
                    <div class="battle-box-mini battle-left"></div>
                    <div class="battle-glow"></div>
                    <div class="battle-box-mini battle-right"></div>
                </div>
                <div class="game-info">
                    <span class="game-title">Case Battles</span>
                    <span class="edge-text">3% edge</span>
                </div>
            </div>

            <!-- Mines -->
            <div class="game-card card-mines">
                <div class="graphic-wrap">
                    <div class="mine-ball"></div>
                    <div class="red-gem"></div>
                </div>
                <div class="game-info">
                    <span class="game-title">Mines</span>
                    <span class="edge-text">3% edge</span>
                </div>
            </div>

            <!-- Towers -->
            <div class="game-card card-towers">
                <div class="graphic-wrap">
                    <div class="tower-icon"></div>
                </div>
                <div class="game-info">
                    <span class="game-title">Towers</span>
                    <span class="edge-text">3% edge</span>
                </div>
            </div>

            <!-- Coinflip -->
            <div class="game-card card-coinflip">
                <div class="graphic-wrap">
                    <div class="coin-3d-glow"></div>
                </div>
                <div class="game-info">
                    <span class="game-title">Coinflip</span>
                    <span class="edge-text">2.5% edge</span>
                </div>
            </div>

            <!-- Blackjack -->
            <div class="game-card card-blackjack">
                <div class="graphic-wrap">
                    <div class="card-shape card-left">A ♠</div>
                    <div class="card-shape card-right">10 ♠</div>
                </div>
                <div class="game-info">
                    <span class="game-title">Blackjack</span>
                    <span class="edge-text">0.5% edge</span>
                </div>
            </div>

        </div>

    </main>

</body>
</html>
