<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutMoney - Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #121722;
            border-bottom: 2px solid #1f2638;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Il cerchio con il bordo rosa luminoso */
        .logo-badge {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ff3399;
            box-shadow: 0 0 12px rgba(255, 51, 153, 0.7);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            flex-shrink: 0;
        }

        /* La foto inserita dentro il cerchio e zoomata sull'insegna */
        .logo-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(3.5);
            object-position: 48% 45%;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 51, 153, 0.8), 0 0 20px rgba(255, 51, 153, 0.4);
        }

        .brand-title span {
            color: #ff3399;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.75rem;
            color: #6b7280;
            background-color: #121722;
            border-top: 1px solid #1f2638;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-badge">
                <!-- La foto esatta inserita all'interno del cerchio -->
                <img src="http://googleusercontent.com/image_collection/image_retrieval/10782868531433145201_0" alt="Logo DonutMoney">
            </div>
            <div class="brand-title">Donut<span>Money</span></div>
        </div>
        <div></div>
    </header>

    <main>
        <!-- Area centrale pulita -->
    </main>

    <footer>
        &copy; 2026 DonutMoney. Tutti i diritti riservati.
    </footer>

</body>
</html>
