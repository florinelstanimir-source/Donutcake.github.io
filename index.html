<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Gaming Terminal</title>
    <style>
        :root {
            --bg-base: #090a0f;
            --surface: #131722;
            --surface-hover: #1b2234;
            --border: rgba(255, 255, 255, 0.08);
            --accent-green: #00e676;
            --accent-red: #ff1744;
            --accent-blue: #2979ff;
            --gold: #ffb300;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
        }

        .terminal-container {
            width: 100%;
            max-width: 650px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand span {
            color: var(--accent-blue);
        }

        .wallet {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .wallet-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .wallet-amount {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* Navigazione Moduli */
        .module-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .nav-btn.active {
            background: var(--surface-hover);
            color: var(--text-main);
            border-color: rgba(41, 121, 255, 0.4);
        }

        .module-view {
            display: none;
        }

        .module-view.active {
            display: block;
        }

        /* Controlli Comune */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 16px;
        }

        .input-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-box label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .input-group-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"] {
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: 700;
            width: 90px;
            text-align: right;
            outline: none;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .quick-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        /* MODULO 1: DICE HIGHER/LOWER */
        .dice-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 16px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .dice-number {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .dice-target-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .dice-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        /* MODULO 2: MINESWEEPER STAKE STYLE */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .mine-cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }

        .mine-cell:hover:not(.revealed) {
            background: rgba(255, 255, 255, 0.08);
        }

        .mine-cell.revealed-gem {
            background: rgba(0, 230, 118, 0.15);
            border-color: var(--accent-green);
        }

        .mine-cell.revealed-mine {
            background: rgba(255, 23, 68, 0.15);
            border-color: var(--accent-red);
        }

        /* MODULO 3: TOWER STACK */
        .tower-arena {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 16px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Pulsante Principale */
        .btn-action {
            background: var(--accent-blue);
            border: none;
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: filter 0.2s;
        }

        .btn-action:hover {
            filter: brightness(1.1);
        }

        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .log-status {
            margin-top: 14px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <header>
            <div class="brand">Apex<span>Terminal</span></div>
            <div class="wallet">
                <span class="wallet-label">Balance</span>
                <span class="wallet-amount" id="walletBalance">$1,000.00</span>
            </div>
        </header>

        <div class="module-nav">
            <button class="nav-btn active" onclick="switchModule('dice')">Dice Roll</button>
            <button class="nav-btn" onclick="switchModule('mines')">Mines</button>
            <button class="nav-btn" onclick="switchModule('coin')">Coinflip</button>
        </div>

        <!-- MODULO DICE -->
        <div id="mod-dice" class="module-view active">
            <div class="dice-display">
                <div class="dice-number" id="diceResult">50.00</div>
                <div class="dice-target-info">Tira sopra 50.0 per vincere (2.0x)</div>
            </div>
            <div class="control-panel">
                <div class="input-box">
                    <label>Puntata</label>
                    <div class="input-group-right">
                        <input type="number" id="betDice" value="50" min="1">
                        <button class="quick-btn" onclick="adjust('Dice', 0.5)">½</button>
                        <button class="quick-btn" onclick="adjust('Dice', 2)">2×</button>
                    </div>
                </div>
                <button class="btn-action" id="btnDice" onclick="playDice()">Esegui Roll</button>
            </div>
        </div>

        <!-- MODULO MINES -->
        <div id="mod-mines" class="module-view">
            <div class="mines-grid" id="minesGrid">
                <!-- Generate via JS -->
            </div>
            <div class="control-panel">
                <div class="input-box">
                    <label>Puntata</label>
                    <div class="input-group-right">
                        <input type="number" id="betMines" value="50" min="1">
                        <button class="quick-btn" onclick="adjust('Mines', 0.5)">½</button>
                        <button class="quick-btn" onclick="adjust('Mines', 2)">2×</button>
                    </div>
                </div>
                <button class="btn-action" id="btnMines" onclick="startMines()">Inizia Partita Mines</button>
            </div>
        </div>

        <!-- MODULO COINFLIP -->
        <div id="mod-coin" class="module-view">
            <div class="dice-display">
                <div id="coinSymbol" style="font-size: 3rem;">🪙</div>
                <div class="dice-target-info" id="coinStatusText">Seleziona Testa o Croce</div>
            </div>
            <div class="control-panel">
                <div class="input-box">
                    <label>Puntata</label>
                    <div class="input-group-right">
                        <input type="number" id="betCoin" value="50" min="1">
                        <button class="quick-btn" onclick="adjust('Coin', 0.5)">½</button>
                        <button class="quick-btn" onclick="adjust('Coin', 2)">2×</button>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <button class="quick-btn" id="btnHead" onclick="selectCoin('head')" style="padding: 10px; font-weight: bold; background: rgba(41,121,255,0.2);">TESTA</button>
                    <button class="quick-btn" id="btnTail" onclick="selectCoin('tail')" style="padding: 10px; font-weight: bold;">CROCE</button>
                </div>
                <button class="btn-action" id="btnCoinPlay" onclick="playCoin()">Lancia Moneta</button>
            </div>
        </div>

        <div class="log-status" id="logStatus">Pronto all'operazione.</div>
    </div>

    <script>
        let balance = 1000.00;

        function updateWallet() {
            document.getElementById('walletBalance').textContent = `$${balance.toFixed(2)}`;
        }

        function switchModule(modKey) {
            document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(`mod-${modKey}`).classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('logStatus').textContent = "Modulo cambiato.";
        }

        function adjust(mod, mult) {
            const input = document.getElementById(`bet${mod}`);
            let val = parseFloat(input.value) || 0;
            let res = Math.max(1, Math.floor(val * mult));
            if (res > balance) res = balance;
            input.value = res;
        }

        // --- DICE LOGIC ---
        function playDice() {
            const bet = parseFloat(document.getElementById('betDice').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) {
                document.getElementById('logStatus').textContent = "Fondi insufficienti o puntata non valida.";
                return;
            }

            balance -= bet;
            updateWallet();

            const roll = parseFloat((Math.random() * 100).toFixed(2));
            document.getElementById('diceResult').textContent = roll.toFixed(2);

            if (roll > 50) {
                let win = bet * 2;
                balance += win;
                document.getElementById('logStatus').innerHTML = `<span style="color: var(--accent-green);">Vinto $${win.toFixed(2)} (Roll: ${roll})</span>`;
            } else {
                document.getElementById('logStatus').innerHTML = `<span style="color: var(--accent-red);">Perso (Roll: ${roll})</span>`;
            }
            updateWallet();
        }

        // --- MINES SETUP ---
        const gridEl = document.getElementById('minesGrid');
        let minesActive = false;
        let minesBet = 0;
        let revealedCount = 0;

        function initMinesGrid() {
            gridEl.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.textContent = '·';
                cell.onclick = () => clickMineCell(i);
                gridEl.appendChild(cell);
            }
        }
        initMinesGrid();

        function startMines() {
            const bet = parseFloat(document.getElementById('betMines').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) {
                document.getElementById('logStatus').textContent = "Fondi insufficienti.";
                return;
            }
            balance -= bet;
            updateWallet();
            minesBet = bet;
            minesActive = true;
            revealedCount = 0;
            initMinesGrid();
            document.getElementById('btnMines').textContent = "In gioco...";
            document.getElementById('btnMines').disabled = true;
            document.getElementById('logStatus').textContent = "Seleziona le celle sicure!";
        }

        function clickMineCell(index) {
            if (!minesActive) return;
            const cell = gridEl.children[index];
            if (cell.classList.contains('revealed-gem')) return;

            // 20% probabilità di mina
            const isMine = Math.random() < 0.2;
            if (isMine) {
                cell.className = 'mine-cell revealed-mine';
                cell.textContent = '💣';
                minesActive = false;
                document.getElementById('btnMines').textContent = "Inizia Partita Mines";
                document.getElementById('btnMines').disabled = false;
                document.getElementById('logStatus').innerHTML = `<span style="color: var(--accent-red);">Hai beccato una mina! Perso $${minesBet.toFixed(2)}</span>`;
            } else {
                cell.className = 'mine-cell revealed-gem';
                cell.textContent = '💎';
                revealedCount++;
                let currentMultiplier = 1 + (revealedCount * 0.3);
                let potentialWin = minesBet * currentMultiplier;
                document.getElementById('logStatus').innerHTML = `<span style="color: var(--accent-green);">GEMMA! Moltiplicatore: ${currentMultiplier.toFixed(1)}x (Premio: $${potentialWin.toFixed(2)})</span>`;
            }
        }

        // --- COINFLIP LOGIC ---
        let selectedSide = 'head';
        function selectCoin(side) {
            selectedSide = side;
            document.getElementById('btnHead').style.background = side === 'head' ? 'rgba(41,121,255,0.2)' : 'transparent';
            document.getElementById('btnTail').style.background = side === 'tail' ? 'rgba(41,121,255,0.2)' : 'transparent';
        }

        function playCoin() {
            const bet = parseFloat(document.getElementById('betCoin').value);
            if (isNaN(bet) || bet <= 0 || bet > balance) {
                document.getElementById('logStatus').textContent = "Fondi insufficienti.";
                return;
            }
            balance -= bet;
            updateWallet();

            const outcome = Math.random() < 0.5 ? 'head' : 'tail';
            document.getElementById('coinSymbol').textContent = outcome === 'head' ? '👑' : '🪙';

            if (selectedSide === outcome) {
                let win = bet * 2;
                balance += win;
                document.getElementById('logStatus').innerHTML = `<span style="color: var(--accent-green);">Uscito ${outcome.toUpperCase()}! Vinto $${win.toFixed(2)}</span>`;
            } else {
                document.getElementById('logStatus').innerHTML = `<span style="color: var(--accent-red);">Uscito ${outcome.toUpperCase()}. Hai perso.</span>`;
            }
            updateWallet();
        }
    </script>
</body>
</html>
