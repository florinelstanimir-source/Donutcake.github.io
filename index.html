<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DonutCake - Mines</title>
    <style>
        :root {
            --bg-main: #0c1015;
            --card-bg: #131a23;
            --border-color: rgba(255, 255, 255, 0.08);
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.4);
            --pink: #ff2a85;
            --gold: #ffd700;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navbar */
        nav {
            background-color: #0f172a;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .nav-logo span {
            color: var(--green);
            display: block;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }

        .balance-pill {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--gold);
        }

        /* Container */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 12px;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Mines 5x5 Grid */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            aspect-ratio: 1;
        }

        .mine-cell {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.1s ease;
        }

        .mine-cell:active {
            transform: scale(0.92);
        }

        /* Controls */
        .control-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-box label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 800;
        }

        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-row input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 800;
            width: 100px;
            outline: none;
        }

        .action-btn {
            background: var(--green);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--green-glow);
            letter-spacing: 0.5px;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .status-msg {
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-logo">
            Donut
            <span>Cake</span>
        </div>
        <div class="balance-pill" id="balanceDisplay">
            🪙 40.00
        </div>
    </nav>

    <!-- CONTAINER -->
    <div class="container">
        
        <!-- 5x5 GRID -->
        <div class="mines-grid" id="minesGrid">
            <!-- Generate dynamically -->
        </div>

        <!-- INPUTS -->
        <div class="control-box">
            <label>Puntata (🪙)</label>
            <div class="control-row">
                <input type="number" id="betInput" value="10" min="1">
            </div>
        </div>

        <div class="control-box">
            <label>Numero Mine (1-24)</label>
            <div class="control-row">
                <input type="number" id="minesCount" value="1" min="1" max="24">
            </div>
        </div>

        <button class="action-btn" id="playBtn" onclick="toggleGame()">Inizia Partita</button>
        <div class="status-msg" id="statusMsg">Tocca "Inizia Partita" per giocare</div>

    </div>

    <script>
        let balance = 40.00;
        let gameActive = false;
        let minePositions = [];
        let revealedCount = 0;

        const gridEl = document.getElementById('minesGrid');
        const balanceEl = document.getElementById('balanceDisplay');
        const playBtn = document.getElementById('playBtn');
        const statusMsg = document.getElementById('statusMsg');

        function updateBalance() {
            balanceEl.innerHTML = `🪙 ${balance.toFixed(2)}`;
        }

        // Inizializza la griglia vuota 5x5 (25 celle)
        function initGrid(interactive = false) {
            gridEl.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                let cell = document.createElement('div');
                cell.className = 'mine-cell';
                cell.textContent = '💎';
                if (interactive) {
                    cell.onclick = () => revealCell(i, cell);
                }
                gridEl.appendChild(cell);
            }
        }

        initGrid(false);

        function toggleGame() {
            if (!gameActive) {
                let bet = parseFloat(document.getElementById('betInput').value) || 0;
                let numMines = parseInt(document.getElementById('minesCount').value) || 1;

                if (bet <= 0 || bet > balance) {
                    statusMsg.textContent = "Fondi non sufficienti o puntata non valida!";
                    return;
                }

                balance -= bet;
                updateBalance();

                // Genera mine casuali
                minePositions = [];
                while(minePositions.length < numMines) {
                    let r = Math.floor(Math.random() * 25);
                    if(!minePositions.includes(r)) minePositions.push(r);
                }

                gameActive = true;
                revealedCount = 0;
                playBtn.textContent = "Incassa Vincita";
                playBtn.style.background = "var(--gold)";
                statusMsg.textContent = "Partita in corso! Trova le gemme.";

                // Reset griglia interattiva coperta
                gridEl.innerHTML = '';
                for (let i = 0; i < 25; i++) {
                    let cell = document.createElement('div');
                    cell.className = 'mine-cell';
                    cell.onclick = () => revealCell(i, cell);
                    gridEl.appendChild(cell);
                }
            } else {
                // Incassa
                let bet = parseFloat(document.getElementById('betInput').value);
                let win = bet * (1 + (revealedCount * 0.2));
                balance += win;
                updateBalance();
                statusMsg.innerHTML = `<span style="color:var(--gold);">Hai incassato $${win.toFixed(2)}!</span>`;
                endGame();
            }
        }

        function revealCell(index, cell) {
            if (!gameActive || cell.classList.contains('revealed')) return;

            cell.classList.add('revealed');
            if (minePositions.includes(index)) {
                // Mina trovata!
                cell.textContent = '💣';
                cell.style.background = 'rgba(255, 42, 133, 0.3)';
                statusMsg.innerHTML = `<span style="color:var(--pink);">Hai calpestato una mina! Hai perso.</span>`;
                
                // Rivela tutte le mine
                Array.from(gridEl.children).forEach((c, idx) => {
                    if (minePositions.includes(idx)) {
                        c.textContent = '💣';
                        c.style.background = 'rgba(255, 42, 133, 0.2)';
                    }
                });
                endGame();
            } else {
                // Gemma sicura
                cell.textContent = '💎';
                cell.style.background = 'rgba(34, 197, 94, 0.2)';
                revealedCount++;
                statusMsg.textContent = `Gemma trovata! Caselle sicure: ${revealedCount}`;
            }
        }

        function endGame() {
            gameActive = false;
            playBtn.textContent = "Inizia Partita";
            playBtn.style.background = "var(--green)";
        }
    </script>
</body>
</html>
