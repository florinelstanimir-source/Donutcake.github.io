<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mines Minigame</title>
  <style>
    body {
      background-color: #0f0a14;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .mines-card {
      width: 280px;
      border-radius: 20px;
      overflow: hidden;
      background-color: #1a0f1a;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      border: 2px solid #2a162a;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .mines-card:hover {
      transform: scale(1.03);
    }

    .mines-img {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="mines-card" onclick="avviaGioco()">
    <!-- Assicurati che il nome del file dell'immagine corrisponda -->
    <img src="tua-immagine.jpg" alt="Mines 3% edge" class="mines-img">
  </div>

  <script>
    function avviaGioco() {
      console.log("Hai cliccato sulla card di Mines!");
      // Qui puoi aggiungere la logica del tuo minigioco
    }
  </script>

</body>
</html>
