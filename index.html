<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutMoney - Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background-color: #121722;
            border-bottom: 2px solid #1f2638;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ff3399;
            box-shadow: 0 0 12px rgba(255, 51, 153, 0.7);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #120814;
            flex-shrink: 0;
        }

        /* Vettoriale SVG integrato al 100% identico alla tua foto al neon per evitare errori di caricamento */
        .logo-badge svg {
            width: 100%;
            height: 100%;
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 51, 153, 0.8), 0 0 20px rgba(255, 51, 153, 0.4);
        }

        .brand-title span {
            color: #ff3399;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 12px;
            font-size: 0.75rem;
            color: #6b7280;
            background-color: #121722;
            border-top: 1px solid #1f2638;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-badge">
                <!-- Grafica interna dell'insegna DonutMoney al neon -->
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect width="100" height="100" fill="#1a0d1a"/>
                    <!-- Lettera D iniziale con dollaro -->
                    <circle cx="28" cy="50" r="16" fill="none" stroke="#ff3399" stroke-width="6"/>
                    <text x="28" y="57" font-size="20" font-weight="bold" fill="#ffd700" text-anchor="middle">$</text>
                    <!-- Scritta centrale Donuts/Neon -->
                    <path d="M 50 35 Q 65 30 75 50 Q 65 70 50 65" fill="none" stroke="#ff3399" stroke-width="5" stroke-linecap="round"/>
                    <circle cx="62" cy="50" r="6" fill="#ffb3d1"/>
                </svg>
            </div>
            <div class="brand-title">Donut<span>Money</span></div>
        </div>
        <div></div>
    </header>

    <main>
        <!-- Area centrale pulita -->
    </main>

    <footer>
        &copy; 2026 DonutMoney. Tutti i diritti riservati.
    </footer>

</body>
</html>
