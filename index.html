<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DonutMoney</title>
  <style>
    :root {
      --bg-dark: #05070d;
      --bg-panel: #0d1220;
      --pink: #ff4fd8;
      --pink-strong: #ff2ec9;
      --yellow: #f7d57a;
      --white: #ffffff;
      --gray: #c7c7c7;
      --border: rgba(255,255,255,0.08);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
      color: white;
    }

    body {
      display: grid;
      place-items: center;
    }

    .phone {
      width: 390px;
      height: 844px;
      background: linear-gradient(180deg, #0b0f17 0%, #0a0d13 100%);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      position: relative;
      border: 2px solid rgba(255,255,255,0.08);
    }

    .statusbar {
      height: 72px;
      padding: 12px 18px 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.92);
      color: #111;
      font-weight: 700;
    }

    .time {
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
    }

    .signal {
      width: 18px;
      height: 12px;
      position: relative;
      border: 2px solid #111;
      border-top: none;
      border-radius: 0 0 4px 4px;
      transform: rotate(180deg);
    }

    .signal::before {
      content: "";
      position: absolute;
      inset: 2px 2px 0 2px;
      background: #111;
      border-radius: 0 0 2px 2px;
    }

    .wifi {
      width: 16px;
      height: 16px;
      position: relative;
      border: 2px solid transparent;
      border-top-color: #111;
      border-radius: 50%;
      transform: rotate(180deg);
    }

    .battery {
      width: 24px;
      height: 12px;
      border: 2px solid #111;
      border-radius: 3px;
      position: relative;
      background: transparent;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 6px;
      background: #111;
      border-radius: 0 3px 3px 0;
    }

    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 14px;
      height: 4px;
      background: #111;
      border-radius: 1px;
    }

    .toolbar {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #efefef;
      color: #111;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 20px;
      font-weight: 700;
    }

    .back-arrow {
      font-size: 30px;
      line-height: 1;
      transform: translateY(-2px);
    }

    .site-title {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .toolbar-icons {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 24px;
    }

    .browser {
      height: 100%;
      background: #070b12;
      position: relative;
    }

    .top-brand {
      padding-top: 18px;
      padding-left: 26px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand-circle {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #1a1020 0%, #100c18 55%, #05070b 100%);
      border: 4px solid var(--pink);
      box-shadow: 0 0 18px rgba(255, 79, 216, 0.9);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .brand-circle::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 3px solid rgba(255, 79, 216, 0.25);
    }

    .brand-mark {
      font-size: 48px;
      font-weight: 900;
      color: var(--pink);
      text-shadow: 0 0 12px rgba(255, 79, 216, 0.8);
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .brand-name {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -2px;
      color: var(--pink);
      text-shadow: 0 0 16px rgba(255, 79, 216, 0.9);
      transform: translateY(8px);
    }

    .hero {
      height: 450px;
      background: rgba(0,0,0,0.18);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,79,216,0.08), transparent 60%);
    }

    .video-box {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: 300px;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(135deg, #0f1c2d, #0a0d14);
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.06);
    }

    .video-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(51,72,98,0.85), rgba(30,30,40,0.25));
    }

    .video-box::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      box-shadow: 0 0 0 20px rgba(255,255,255,0.03);
    }

    .bottom-actions {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 2;
    }

    .action {
      width: 100px;
      text-align: center;
      color: white;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
      font-size: 26px;
      color: white;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.04);
    }

    .icon-btn.primary {
      width: 78px;
      height: 78px;
      background: linear-gradient(180deg, #ff1dce, #ff5ae1);
      border: none;
      box-shadow: 0 0 18px rgba(255, 79, 216, 0.85);
      color: white;
      font-size: 40px;
      font-weight: 700;
    }

    .extra-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 110px;
      background: rgba(9, 12, 18, 0.2);
      border-top: 1px solid rgba(255,255,255,0.03);
    }

    @media (max-width: 420px) {
      .phone {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <div class="time">00:38</div>
      <div class="status-icons">
        <div class="signal"></div>
        <div class="wifi"></div>
        <div class="battery"></div>
      </div>
    </div>

    <div class="toolbar">
      <div class="nav-left">
        <div class="back-arrow">←</div>
        <div class="site-title">source.github.io</div>
      </div>

      <div class="toolbar-icons">
        <span>◌</span>
        <span>⋯</span>
      </div>
    </div>

    <div class="browser">
      <div class="top-brand">
        <div class="brand-circle">
          <div class="brand-mark">$</div>
        </div>

        <div class="brand-name">DonutMoney</div>
      </div>

      <div class="hero">
        <div class="video-box"></div>
      </div>

      <div class="bottom-actions">
        <div class="action">
          <div class="icon-btn">◌</div>
          <div>Chiedi qualsiasi cosa</div>
        </div>

        <div class="action">
          <div class="icon-btn primary">＋</div>
          <div>Nuova scheda</div>
        </div>

        <div class="action">
          <div class="icon-btn">Schede</div>
        </div>
      </div>

      <div class="extra-note"></div>
    </div>
  </div>
</body>
</html>
