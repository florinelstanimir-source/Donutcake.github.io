<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DonutFlip</title>
    <style>
        :root {
            --bg-main: #0c1015;
            --card-bg: #131a23;
            --border-color: rgba(255, 255, 255, 0.08);
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Top Navbar */
        nav {
            background-color: #0f172a;
            border-bottom: 1px solid var(--border-color);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 900;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .nav-logo span {
            color: var(--green);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-pill {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .balance-pill span {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .plus-btn {
            background: var(--green);
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }

        .signin-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 2px 10px var(--green-glow);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .section-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* Top Banners Carousel */
        .banners-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 24px;
            scrollbar-width: none;
        }

        .banners-scroll::-webkit-scrollbar {
            display: none;
        }

        .banner-card {
            min-width: 240px;
            height: 120px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .banner-card h3 {
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .banner-card p {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* Games Grid (3x3 on desktop, responsive) */
        .games-section {
            margin-top: 20px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
        }

        .game-item-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 110px;
            cursor: pointer;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }

        .game-item-card:active {
            transform: scale(0.96);
            border-color: var(--green);
        }

        .game-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .game-name {
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-muted);
        }

        /* Modal / Game Overlay View */
        #gameModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(12, 16, 21, 0.95);
            z-index: 200;
            padding: 20px;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-logo">
            🎲 DONUT<span>FLIP</span>
        </div>
        <div class="nav-right">
            <div class="balance-pill">
                <span>🪙</span>
                <span id="userBalance">0.00</span>
                <button class="plus-btn">+</button>
            </div>
            <button class="signin-btn">Sign In</button>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container">
        
        <!-- TOP PROMO CARDS -->
        <div class="section-title">DonutFlip</div>
        <div class="banners-scroll">
            <div class="banner-card" style="border-color: rgba(147, 51, 234, 0.4);">
                <h3>Race</h3>
                <p>Climb the board, win the pot</p>
            </div>
            <div class="banner-card" style="border-color: rgba(34, 197, 94, 0.4);">
                <h3>Referrals</h3>
                <p>Invite friends, earn commission</p>
            </div>
            <div class="banner-card" style="border-color: rgba(59, 130, 246, 0.4);">
                <h3>Discord</h3>
                <p>Join the community</p>
            </div>
        </div>

        <!-- GAMES GRID (3x3) -->
        <div class="games-section">
            <div class="section-title">Games</div>
            <div class="section-sub">Play using site balance</div>

            <div class="games-grid">
                <div class="game-item-card" onclick="launchGame('Cases')">
                    <div class="game-icon">📦</div>
                    <div class="game-name">Cases</div>
                </div>
                <div class="game-item-card" onclick="launchGame('Case Battles')">
                    <div class="game-icon">⚔️</div>
                    <div class="game-name">Case Battles</div>
                </div>
                <div class="game-item-card" onclick="launchGame('Mines')">
                    <div class="game-icon">💣</div>
                    <div class="game-name">Mines</div>
                </div>
                <div class="game-item-card" onclick="launchGame('Towers')">
                    <div class="game-icon">📈</div>
                    <div class="game-name">Towers</div>
                </div>
                <div class="game-item-card" onclick="launchGame('Coinflip')">
                    <div class="game-icon">🪙</div>
                    <div class="game-name">Coinflip</div>
                </div>
                <div class="game-item-card" onclick="launchGame('Blackjack')">
                    <div class="game-icon">🃏</div>
                    <div class="game-name">Blackjack</div>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME PLAY MODAL -->
    <div id="gameModal">
        <div class="modal-header">
            <h2 id="modalTitle" style="color: var(--green);">Game</h2>
            <button class="close-btn" onclick="closeModal()">Chiudi</button>
        </div>
        <div class="modal-body">
            <div id="modalContent" style="font-size: 3rem;">🎮</div>
            <p id="modalDesc" style="color: var(--text-muted); font-size: 0.9rem;">Pronto per giocare!</p>
            <button onclick="playAction()" style="background: var(--green); border: none; color: white; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer;">Gioca Subito</button>
        </div>
    </div>

    <script>
        let balance = 100.00;
        document.getElementById('userBalance').textContent = balance.toFixed(2);

        function launchGame(name) {
            document.getElementById('modalTitle').textContent = name;
            document.getElementById('modalDesc').textContent = `Stai giocando a ${name} con il saldo del sito.`;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

        function playAction() {
            if(balance >= 10) {
                balance -= 10;
                balance += 20; // Vincita simulata
                document.getElementById('userBalance').textContent = balance.toFixed(2);
                document.getElementById('modalDesc').innerHTML = '<span style="color: var(--green); font-weight: bold;">Hai vinto +$10.00! 🎉</span>';
            } else {
                alert("Saldo insufficiente!");
            }
        }
    </script>
</body>
</html>
