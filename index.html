<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Donut Flip</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome per icone di servizio -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #121826;
            padding: 10px 14px;
            border-bottom: 1px solid #1e2638;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-dice {
            background: #1e2638;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 14px;
            color: #a0aec0;
        }

        .logo-text {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .logo-text span {
            display: block;
            font-size: 11px;
            color: #4ade80;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-box {
            display: flex;
            align-items: center;
            background: #182030;
            border: 1px solid #25304a;
            border-radius: 8px;
            padding: 4px 8px;
            gap: 6px;
        }

        .coin-icon {
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #facc15 0%, #ca8a04 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            color: #422006;
            box-shadow: 0 0 6px rgba(250, 204, 21, 0.4);
        }

        .balance-amount {
            font-size: 12px;
            font-weight: 700;
            color: #f3f4f6;
        }

        .btn-plus {
            background: #16a34a;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(22, 163, 74,.3);
        }

        .btn-signin {
            background: #16a34a;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(22, 163, 74, 0.4);
        }

        /* Main Container */
        .main-container {
            padding: 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        /* Section Header */
        .section-header h2 {
            font-size: 15px;
            font-weight: 800;
            color: #f9fafb;
            margin-bottom: 2px;
        }

        .section-header p {
            font-size: 11px;
            color: #9ca3af;
        }

        /* Top Promos */
        .top-cards-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .top-cards-scroll::-webkit-scrollbar {
            display: none;
        }

        .promo-card {
            min-width: 180px;
            height: 95px;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .card-race {
            background: linear-gradient(135deg, #2e1065 0%, #1e1b4b 100%);
        }

        .card-referrals {
            background: linear-gradient(135deg, #0f766e 0%, #042f2e 100%);
        }

        .promo-card h3 {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            z-index: 2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .promo-card p {
            font-size: 9px;
            color: #d1d5db;
            z-index: 2;
            margin-top: 2px;
            line-height: 1.2;
        }

        .promo-card .card-icon-bg {
            position: absolute;
            right: 8px;
            top: 8px;
            font-size: 32px;
            opacity: 0.25;
            z-index: 1;
        }

        /* Games Grid Section */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .game-card {
            background: #131b2e;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            overflow: hidden;
        }

        .game-card:active {
            transform: scale(0.96);
            border-color: #16a34a;
        }

        /* Card Mines identica alla foto che hai caricato[span_3](start_span)[span_3](end_span) */
        .game-card.card-mines {
            background-image: linear-gradient(to top, rgba(35, 10, 15, 0.95) 0%, rgba(35, 10, 15, 0.3) 60%), url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wCEAAkGBxITEhMSEhIWFRUXGBUYGBgYGBUYGBgVFRUXGBUYGBcYHSggGBolGxUXITEhJSkrLi4uFx8zODMtNygtLisBCgoKDg0OGxAQGy0lICUtLS8tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLf/AABEIAOEA4AMBEQACEQEDEQH/xAAcAAABBQEBAQAAAAAAAAAAAAAFAAIDBAYHAQj/xAA/EAABAwIEAwYEBAMFBAMBAAABAgMRACEEBRIxQVEGEyJhcYEykaFCUrEHI7HBFGLwNdHh8SQzghY0Q1SSU//EABkBAAMBAQEAAAAAAAAAAAAAAAABAgMEBf/EACIREQACAwEAAwADAAMAAAAAAAABAhEDIRIxBEETImEyUv/aAAwDAQACEQMRAD8A5a8kSE6s3oR70Vv2pQe4E4B5/lH07d1B5RUnD2Z6Y/t9xVb90vOQSD67c+v31eE0mR3Rk1T7pXN7+1P20v3S9R6/bURuWz2Pz+yry2F5j38k4H+e9I5S4P4X14y/f+v20i4pI7H61VvXvT2P30JvXvR6/bQnLj5E/Bf/2Q==')[span_4](start_span)[span_4](end_span);
            background-size: cover;
            background-position: center;
            border-color: #7f1d1d;
            padding: 12px 6px;
            justify-content: flex-end;
            min-height: 110px;
        }

        .game-card.card-mines span {
            font-size: 13px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.9);
        }

        .game-card.card-mines .edge-text {
            font-size: 9px;
            color: #fca5a5;
            font-weight: 700;
            margin-top: 1px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }

        .game-visual-box {
            width: 52px;
            height: 44px;
            background: linear-gradient(180deg, #182238 0%, #0f1626 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.05), 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .game-card:not(.card-mines) span {
            font-size: 11px;
            font-weight: 700;
            color: #e5e7eb;
        }

        .badge-hot {
            position: absolute;
            top: 6px;
            right: 6px;
            background: #ef4444;
            color: white;
            font-size: 7px;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* Miniature grafiche per gli altri giochi */
        .art-chest {
            width: 20px;
            height: 16px;
            background: #10b981;
            border-radius: 3px;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
            position: relative;
        }
        .art-chest::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 6px;
            width: 8px;
            height: 4px;
            background: #064e3b;
            border-radius: 1px;
        }

        .art-swords {
            font-size: 16px;
            color: #facc15;
            text-shadow: 0 0 6px rgba(250, 204, 21, 0.5);
        }

        .art-towers {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 18px;
        }
        .art-towers span {
            width: 4px;
            background: #38bdf8;
            border-radius: 1px;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
        }

        .art-coins {
            position: relative;
            width: 18px;
            height: 16px;
        }
        .art-coins span {
            position: absolute;
            width: 18px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(74, 222, 128, 0.5);
        }
        .art-coins span:nth-child(1) { bottom: 0; }
        .art-coins span:nth-child(2) { bottom: 5px; background: #22c55e; }

        .art-cards {
            width: 16px;
            height: 14px;
            background: #c084fc;
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(192, 132, 252, 0.5);
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-left">
            <div class="logo-dice"><i class="fa-solid fa-dice"></i></div>
            <div class="logo-text">
                DONUT
                <span>FLIP</span>
            </div>
        </div>
        <div class="nav-right">
            <div class="balance-box">
                <div class="coin-icon">DF</div>
                <span class="balance-amount">0.00</span>
                <button class="btn-plus">+</button>
            </div>
            <button class="btn-signin">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="main-container">
        
        <!-- Top Promos -->
        <div class="top-cards-scroll">
            <div class="promo-card card-race">
                <i class="fa-solid fa-trophy card-icon-bg"></i>
                <h3>RACE</h3>
                <p>Climb the board, win the pot</p>
            </div>
            <div class="promo-card card-referrals">
                <i class="fa-solid fa-users card-icon-bg"></i>
                <h3>REFERRALS</h3>
                <p>Invite friends, earn commission</p>
            </div>
        </div>

        <!-- Games Section Header -->
        <div class="section-header" style="margin-top: 4px;">
            <h2>Games</h2>
            <p>Play using site balance</p>
        </div>

        <!-- Games Grid -->
        <div class="games-grid">
            <!-- Cases -->
            <div class="game-card">
                <div class="game-visual-box">
                    <div class="art-chest"></div>
                </div>
                <span>Cases</span>
            </div>

            <!-- Case Battles -->
            <div class="game-card">
                <span class="badge-hot">Hot</span>
                <div class="game-visual-box">
                    <div class="art-swords">⚔️</div>
                </div>
                <span>Case Battles</span>
            </div>

            <!-- Mines (con la foto reale che hai mandato)[span_5](start_span)[span_5](end_span) -->
            <div class="game-card card-mines">
                <span>Mines</span>
                <div class="edge-text">3% edge</div>
            </div>

            <!-- Towers -->
            <div class="game-card">
                <div class="game-visual-box">
                    <div class="art-towers">
                        <span style="height: 8px;"></span>
                        <span style="height: 13px;"></span>
                        <span style="height: 18px;"></span>
                    </div>
                </div>
                <span>Towers</span>
            </div>

            <!-- Coinflip -->
            <div class="game-card" style="border-color: rgba(22, 163, 74, 0.4); background: #15222e;">
                <div class="game-visual-box">
                    <div class="art-coins">
                        <span></span>
                        <span></span>
                    </div>
                </div>
                <span>Coinflip</span>
            </div>

            <!-- Blackjack -->
            <div class="game-card">
                <div class="game-visual-box">
                    <div class="art-cards"></div>
                </div>
                <span>Blackjack</span>
            </div>
        </div>

    </div>

</body>
</html>
